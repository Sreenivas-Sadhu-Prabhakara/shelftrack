<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2E2820; }
  body { display: grid; place-items: center; }
  /* 12% safe padding on each side -> mark fills the middle ~76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <!-- punched price-tag with an amber outline: the shelftrack mark -->
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M8 7h9.6a2.4 2.4 0 0 1 1.7.72l4.98 5.0a2.4 2.4 0 0 1 0 3.4l-7.46 7.46a2.4 2.4 0 0 1-3.4 0l-4.98-5.0A2.4 2.4 0 0 1 8 16.9V7z"
          fill="none" stroke="#E08A2B" stroke-width="2.1" stroke-linejoin="round"/>
    <circle cx="12" cy="11" r="2" fill="none" stroke="#E08A2B" stroke-width="1.8"/>
  </svg>
</body>
</html>
